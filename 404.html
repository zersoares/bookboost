<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — BookBoost AI</title>
<meta name="description" content="That page does not exist on BookBoost AI.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/assets/css/design-system.css">
<link rel="stylesheet" href="/assets/css/landing.css">
<script>
  try {
    var t = localStorage.getItem('bookboost.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
  .bb-404 { max-width: 640px; margin: 0 auto; padding: var(--bb-20) var(--bb-6); text-align: center; }
  .bb-404__code { font-size: 0.74rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--bb-text-subtle); }
  .bb-404__actions { display: flex; gap: var(--bb-3); justify-content: center; flex-wrap: wrap; margin-top: var(--bb-8); }
</style>
</head>
<body>
<a class="bb-skip-link" href="#main">Skip to content</a>
<header class="bb-nav">
  <div class="bb-nav__inner">
    <a class="bb-logo" href="/"><span class="bb-logo__mark">B</span> BookBoost <span class="bb-logo__ai">AI</span></a>
    <div class="bb-nav__actions">
      <a class="bb-btn bb-btn--ghost bb-btn--sm" href="/">Product</a>
      <a class="bb-btn bb-btn--primary bb-btn--sm" href="/app.html#/signup">Start free</a>
    </div>
  </div>
</header>
<main id="main" class="bb-404">
  <p class="bb-404__code">Error 404</p>
  <h1 class="bb-display" style="font-size:2.1rem;margin:var(--bb-2) 0 var(--bb-3)">Page not found</h1>
  <p class="bb-lead">That address does not point at anything here. It may have moved, or never existed.</p>
  <div class="bb-404__actions">
    <a class="bb-btn bb-btn--primary" href="/">Back to the homepage</a>
    <a class="bb-btn bb-btn--ghost" href="/app.html">Open the app</a>
  </div>
</main>
</body>
</html>
