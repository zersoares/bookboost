# =====================================================================
# BookPilot AI — Netlify configuration
#
# The site is served as static files with no build step: the front end
# is plain ES modules and CSS, and the functions are dependency-free
# ESM. There is deliberately no `command` here — see README.md,
# "Why there is no build step".
# =====================================================================

[build]
  publish = "."
  functions = "netlify/functions"

# The API functions declare their own paths (/api/bp/*, /api/bp-ai/*, …)
# through `export const config`, so they need no redirect rules here.

# ---------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    # `img-src https:` is required because book covers are author-supplied
    # URLs. `'unsafe-inline'` covers the pre-paint theme script and the
    # inline style attributes the views use; tightening that would need a
    # nonce, which a static host cannot mint per request.
    #
    # `connect-src` is narrowed to the Supabase project: it is the only
    # cross-origin call the browser makes (js/core/auth.js, the GoTrue
    # REST API). js/core/api.js is same-origin, and track/bp.js runs on
    # authors' own sites under their own policy. No wss: entry is needed
    # because nothing here uses Supabase Realtime.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://aobkishzgyclobeulvzh.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com https://www.facebook.com; object-src 'none'"

# The workspace is a private application; keep it out of search results
# even if someone links to it.
[[headers]]
  for = "/app.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ---------------------------------------------------------------------
# Caching
# ---------------------------------------------------------------------

# Font binaries never change content at the same URL — a font swap gets a
# new filename — so cache them hard.
[[headers]]
  for = "/fonts/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The tracking script is embedded on authors' own sites. Short cache so a
# fix reaches them the same day, long enough to avoid a request per page.
[[headers]]
  for = "/track/bp.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# The SQL is version-controlled documentation, not something to serve.
# `force` is required: without it Netlify serves the file on disk and the
# rule never fires, publishing the schema and the RLS policies.
[[redirects]]
  from = "/sql/*"
  to = "/404.html"
  status = 404
  force = true
